{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}Cafe{% endblock %}
    </title>

    <!-- Main Website CSS -->
    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >

    <!-- Navbar CSS -->
    <link
        rel="stylesheet"
        href="{% static 'css/navbar.css' %}"
    >

    <!-- Global Responsive CSS -->
    <link
        rel="stylesheet"
        href="{% static 'css/responsive.css' %}"
    >

    <!-- Page Specific CSS -->
    {% block extra_css %}
    {% endblock %}

</head>


<body>

    {% include 'includes/navbar.html' %}

    {% include 'includes/messages.html' %}

    <main>
        {% block content %}
        {% endblock %}
    </main>

    {% include 'includes/footer.html' %}


    <script src="{% static 'js/main.js' %}"></script>

    {% block extra_js %}
    {% endblock %}

</body>

</html>
