<nav class="navbar">

    <div class="container navbar-container">

        <a href="{% url 'home' %}" class="logo">

            <span class="logo-mark">
                Café
            </span>

            <span class="logo-text">
                Panchayat Cafe
            </span>

        </a>

        <button class="nav-toggle" aria-label="Toggle navigation">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <div class="nav-links">

            <a class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}" href="{% url 'home' %}">
                Home
            </a>

            <a class="nav-link {% if request.resolver_match.url_name == 'about' %}active{% endif %}" href="{% url 'about' %}">
                About
            </a>

            <a class="nav-link {% if request.resolver_match.url_name == 'menu' %}active{% endif %}" href="{% url 'menu' %}">
                Menu
            </a>

            <a class="nav-link {% if request.resolver_match.url_name == 'gallery' %}active{% endif %}" href="{% url 'gallery' %}">
                Gallery
            </a>

            <a class="nav-link {% if request.resolver_match.url_name == 'contact' %}active{% endif %}" href="{% url 'contact' %}">
                Contact
            </a>

            <a class="nav-link cart-link {% if request.resolver_match.url_name == 'cart' or request.resolver_match.url_name == 'checkout' %}active{% endif %}" href="{% url 'cart' %}">
                Cart
            </a>

            {% if user.is_authenticated %}

                <a class="nav-link {% if request.resolver_match.url_name == 'profile' %}active{% endif %}" href="{% url 'profile' %}">
                    Profile
                </a>

                <a class="nav-link nav-button" href="{% url 'logout' %}">
                    Logout
                </a>

            {% else %}

                <a class="nav-link" href="{% url 'login' %}">
                    Login
                </a>

                <a class="nav-link nav-button" href="{% url 'register' %}">
                    Register
                </a>

            {% endif %}

        </div>

    </div>

</nav>
