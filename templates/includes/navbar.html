{% load static %}

<nav class="navbar">

    <div class="container navbar-container">

        <!-- =========================
             BRAND / LOGO
        ========================== -->

        <a href="{% url 'home' %}" class="logo">

            <img
                src="{% static 'images/logo/cafe-logo.png' %}"
                alt="Panchayat Cafe"
                class="logo-image"
            >
        
        </a>
        


        <!-- =========================
             MOBILE TOGGLE
        ========================== -->

        <button
            class="nav-toggle"
            type="button"
            aria-label="Toggle navigation"
            aria-expanded="false"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>


        <!-- =========================
             NAVIGATION LINKS
        ========================== -->

        <div class="nav-links">

            <!-- HOME -->

            <a
                class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}"
                href="{% url 'home' %}"
            >
                Home
            </a>


            <!-- ABOUT -->

            <a
                class="nav-link {% if request.resolver_match.url_name == 'about' %}active{% endif %}"
                href="{% url 'about' %}"
            >
                About
            </a>


            <!-- MENU -->

            <a
                class="nav-link {% if request.resolver_match.url_name == 'menu' %}active{% endif %}"
                href="{% url 'menu' %}"
            >
                Menu
            </a>


            <!-- GALLERY -->

            <a
                class="nav-link {% if request.resolver_match.url_name == 'gallery' %}active{% endif %}"
                href="{% url 'gallery' %}"
            >
                Gallery
            </a>


            <!-- CONTACT -->

            <a
                class="nav-link {% if request.resolver_match.url_name == 'contact' %}active{% endif %}"
                href="{% url 'contact' %}"
            >
                Contact
            </a>


            <!-- CART -->

            <a
                class="nav-link cart-link {% if request.resolver_match.url_name == 'cart' or request.resolver_match.url_name == 'checkout' %}active{% endif %}"
                href="{% url 'cart' %}"
            >
                Cart
            </a>


            {% if user.is_authenticated %}

                <!-- PROFILE -->

                <a
                    class="nav-link {% if request.resolver_match.url_name == 'profile' %}active{% endif %}"
                    href="{% url 'profile' %}"
                >
                    Profile
                </a>


                <!-- LOGOUT -->

                <a
                    class="nav-link nav-button"
                    href="{% url 'logout' %}"
                >
                    Logout
                </a>

            {% else %}

                <!-- LOGIN -->

                <a
                    class="nav-link {% if request.resolver_match.url_name == 'login' %}active{% endif %}"
                    href="{% url 'login' %}"
                >
                    Login
                </a>


                <!-- REGISTER -->

                <a
                    class="nav-link nav-button {% if request.resolver_match.url_name == 'register' %}active{% endif %}"
                    href="{% url 'register' %}"
                >
                    Register
                </a>

            {% endif %}

        </div>

    </div>

</nav>
