{% extends 'base.html' %}

{% block title %}
Checkout | Cafe
{% endblock %}

{% block content %}

<div class="container">

    <h1>
        Checkout
    </h1>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <h2>
            Total: ₹{{ total }}
        </h2>

        <button
            type="submit"
            class="btn"
        >
            Place Order
        </button>

    </form>

</div>

{% endblock %}
