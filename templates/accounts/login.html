{% extends 'base.html' %}

{% block title %}
Login | Cafe
{% endblock %}

{% block content %}

<div class="container">

    <h1>
        Login
    </h1>

    <form method="POST">

        {% csrf_token %}

        <div>
            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                required
            >
        </div>

        <div>
            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                required
            >
        </div>

        <button
            type="submit"
            class="btn"
        >
            Login
        </button>

    </form>

</div>

{% endblock %}
